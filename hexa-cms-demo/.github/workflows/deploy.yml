name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 安装 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: 3. 安装依赖
      run: npm install
      working-directory: ./src/server

    - name: 4. 运行测试
      run: npm test
      working-directory: ./src/server
